name: Metrics

on:
  schedule: [{cron: "0 7 * * *"}] 
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Davi-Jr
          template: classic
          base: header, activity, metadata
          config_timezone: America/Sao_Paulo
