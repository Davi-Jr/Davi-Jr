name: Metrics

on:
  schedule:
    - cron: "0 9 * * *"  
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Davi-Jr
          template: classic
          base: header, activity, metadata
          config_timezone: America/Sao_Paulo

      - name: Update smart counter
        run: |
          if [ ! -f streak.txt ]; then
            echo 1 > streak.txt
          else
            count=$(cat streak.txt)
            count=$((count + 1))
            echo $count > streak.txt
          fi

      - name: Commit changes
        run: |
          git config --global user.name "Davi-Jr"
          git config --global user.email "113936762+Davi-Jr@users.noreply.github.com"
          git add .
          git commit -m "🔥 Day $(cat streak.txt) of consistency" || exit 0
          git push
